[package]
name = "vanilla-engine"
version = "0.3.2"
description = "바닐라엔진(Vanilla Engine). vanilla.js 를 러스트로 옮긴 게임 엔진. 데스크탑과 웹(wasm)에서 돈다"
edition = "2021"
# 저작권자. (LICENSE 의 Copyright 줄과 같다, 라이선스 파일이 없는 크레이트 꾸러미의 고지에 쓰인다)
authors = ["vanillapunch"]
license = "MIT"
repository = "https://github.com/ddukbaek2/vanilla-engine"
keywords = ["gamedev", "engine", "2d", "3d", "wasm"]
categories = ["game-engines"]
# cargo package 에 싣는 파일. (소스와 그 안의 자료, 라이선스 두 파일, README. 문서, 예제, 시험과 시험 자산, 도구는 저장소에만 둔다)
include = ["/src/**/*", "/LICENSE", "/THIRD_PARTY_LICENSES.md", "/README.md"]

# 코드에서 쓰는 이름. (use vanilla::...) 크레이트 이름은 vanilla-engine 이고, 고도(godotengine → godot), 베비(bevyengine → bevy)처럼 코드에서는 짧게 부른다
[lib]
name = "vanilla"

# 기능. (기본으로 모두 켠다)
[features]
default = ["tls"]
# 데스크탑 wss://. (ewebsock 의 tls 기능, tungstenite 가 rustls 와 webpki 뿌리 인증서로 연다. 웹은 브라우저 WebSocket 이라 상관없다)
# 암호 공급자 ring 이 C 를 빌드해서, 그 대상의 C 헤더가 없는 맥에서 윈도우 대상을 검사할 때는 끈다. (cargo check --target x86_64-pc-windows-msvc --no-default-features)
tls = ["ewebsock/tls", "dep:rustls"]

# 워크스페이스. (엔진과 절차 매크로 크레이트 macros/, API 문서 자료 뽑기 tools/apidoc, 제3자 라이선스 모음 짓기 tools/licenses. 게임은 엔진 하나만 의존하고 매크로는 엔진이 다시 내보낸 vanilla::reflect 로 쓴다)
[workspace]
members = ["macros", "tools/apidoc", "tools/licenses"]
# 저장소에 둔 남의 크레이트는 워크스페이스 시험과 문서에서 뺀다. (엔진이 경로로 의존한다)
exclude = ["third_party/rustybuzz", "third_party/ttf-parser"]

[dependencies]
# 반사 매크로. (#[reflect], 원본 vanilla.js 의 실행 중 반사를 컴파일 때 지은 코드로 한다)
vanilla-engine-macros = { version = "0.3.2", path = "macros" }
glow = "0.18"
fontdue = "0.9"
# 웹 글꼴(WOFF, WOFF2)을 TTF 로 푼다. (원본 기본 글꼴 DOSGothic 이 .woff)
wuff = "0.2"
# 글자 모양 짓기. (HarfBuzz 를 옮긴 것. 아랍어 글자 잇기, 합자, 커닝, 결합 부호 자리. 원본은 브라우저 Canvas2D 가 HarfBuzz 로 한다)
# 크롬(HarfBuzz)처럼 글자 자리를 16.16 배율로 셈하려고 hb_font_set_scale 을 더한 판을 저장소에 둔다. (third_party/rustybuzz, rustybuzz 0.20.1 그대로에 배율만 더했다)
rustybuzz = { version = "0.20.1", path = "third_party/rustybuzz" }
# 양방향 정렬. (UAX #9, 오른쪽에서 왼쪽 글자와 섞인 글의 그리는 차례. 원본은 Canvas2D direction)
unicode-bidi = "0.3"
# 가변 글꼴의 윤곽. (축 값을 건 글리프 윤곽, ttf-parser 는 글리프마다 변형이 32 개를 넘는 가변 글꼴(맥 SFNS 같은)의 윤곽을 읽지 못한다. 원본 크롬도 fontations 의 skrifa 를 쓴다)
skrifa = { version = "0.50", default-features = false, features = ["std"] }
# 글꼴 바이트를 든 얼굴. (rustybuzz 얼굴이 빌리는 바이트를 같은 값 안에 들어, 글꼴을 내리면 바이트도 돌려준다)
self_cell = "1"
# 글자 묶음 나누기. (UAX #29, 받침, 결합 부호, 이모지 묶음. 원본 Intl.Segmenter granularity "grapheme")
unicode-segmentation = "1"
# 이모지 성질. (Emoji_Presentation 같은 UTS #51 성질, 글자 묶음이 색 이모지로 그려질지 가린다. rustybuzz 가 이미 쓰는 크레이트에 emoji 기능만 켠다)
# 일반 범주(general-category)는 크롬 캔버스처럼 낱말마다 모양 지을 때 결합 부호와 수식 글자를 앞 글자에 붙이는 데 쓴다.
unicode-properties = { version = "0.1", default-features = false, features = ["emoji", "general-category"] }
# 글자의 문자(Script). (크롬 캔버스의 낱말 나누기가 한중일 기호 가운데 Common, Inherited 를 따로 끊지 않는다. rustybuzz 와 usvg 가 이미 쓰는 판)
unicode-script = "0.5"
# 줄 나누기와 낱말 나누기. (유니코드 줄 나누기 UAX #14 와 낱말 나누기, 공백 없이 쓰는 한중일과 태국어 같은 동남아 글자는 사전으로 나눈다. 크롬의 ICU4C 도 같은 규칙과 사전이다)
# 줄 나누기는 엔진이 그리는 여러 줄 입력 필드가 데스크탑과 웹 캔버스 모드에서 같이 쓴다. (원본은 브라우저 textarea, 크롬은 ICU 줄 나누기) 낱말 나누기는 데스크탑만 쓰고, 웹은 원본처럼 브라우저 Intl.Segmenter 다.
icu_segmenter = "2"
# JsonAsset 이 JSON 을 푼다. (원본 JSON.parse 자리) 객체 키는 적힌 차례를 지킨다. (UIDocument 가 원본 JSON.stringify 와 같은 차례로 쓴다)
# float_roundtrip 은 소수를 원본 JSON.parse 처럼 가장 가까운 f64 로 읽는다. (끄면 마지막 자리가 하나 어긋날 수 있다, 예: 123456789012345680000)
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# 초안 SaveGameManager::save 가 Serialize 를 받는다. (serde_json 이 이미 쓰는 크레이트, derive 는 켜지 않는다)
serde = { version = "1", default-features = false, features = ["std"] }
# FBX 압축 배열(zlib deflate)을 푼다. (원본 DecompressionStream 자리, 순수 러스트 miniz_oxide 기본 백엔드라 wasm32 에서도 돈다)
flate2 = "1"
# 이미지 해석. (원본은 브라우저가 푸는 형식을 모두 받는다. png, jpeg, webp, gif(첫 장), bmp, ico. 웹은 브라우저가 먼저 푼다)
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "bmp", "ico"] }
# PNG 의 색 청크(cICP, iCCP, sRGB, gAMA, cHRM) 읽기. (크롬의 스키아 SkPngRustCodec 도 같은 png 0.18 로 읽는다. image 가 이미 쓰는 같은 판이라 더 받는 크레이트가 없다)
png = "0.18"
# 노드 핸들. (세대 번호가 붙은 키로 씬의 노드 저장소를 가리킨다)
slotmap = "1"
# performance.now() 를 쓰는 Instant. (네이티브에서는 std::time 그대로)
web-time = "1"
# 웹소켓. (데스크탑은 tungstenite 스레드, 웹은 브라우저 WebSocket. 원본 web/websocketclient.js 의 WebSocket 자리)
ewebsock = "0.8"

# 데스크탑: 창(winit)과 GL 3.3 코어 컨텍스트(glutin).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
# 게임패드. (데스크탑 OS 입력, 원본 GamepadManager 의 입력원. 웹은 원본처럼 navigator.getGamepads() 를 직접 읽는다)
gilrs = "0.11"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
# 소리 내기. (기본 출력 장치. 그 위의 WebAudio 노드 그래프 믹서는 엔진이 크롬과 같은 셈으로 짓는다(platform/audio/mixer.rs).
# 소리 스레드 우선순위는 cpal 의 realtime(audio_thread_priority) 대신 엔진이 크롬처럼 운영체제 API 로 건다(platform/audio/threadpriority.rs))
cpal = "0.18"
# 소리 해석. (크롬 decodeAudioData 와 같은 해석기. 크롬은 FLAC, MP3, PCM, Vorbis 를 symphonia 0.6 으로 풀고 이 기능들을 켠다(third_party/rust/chromium_crates_io/Cargo.toml).
# 크롬이 FFmpeg 로 푸는 AAC 는 symphonia 의 aac 를 더 켠다. 컨테이너도 symphonia 의 풀기(wav, ogg, mkv(webm), isomp4(m4a), 그리고 flac, mp3, adts)를 쓴다)
symphonia = { version = "0.6", default-features = false, features = ["all-meta", "flac", "mpa", "ogg", "wav", "mkv", "pcm", "isomp4", "vorbis", "aac", "opt-simd"] }
# PannerNode HRTF 의 FFT. (크롬 158 의 FFTFrame 도 rustfft 6.4 를 avx, sse, neon 기능으로 부른다(rustfft_ffi.rs). symphonia 의 opt-simd 가 이미 받는 같은 판이다)
rustfft = "6.4"
# Opus 해석. (크롬은 libopus 로 푼다. libopus 를 러스트로 옮긴 것으로 symphonia 코덱 등록표에 엔진 해석기로 넣는다. C 빌드가 없어 맥에서 윈도우 대상 검사가 된다)
opus-pure = "0.2"
# AAC 의 HE-AAC(SBR, PS)와 3 채널 이상. (ISO/IEC 14496-3 명세로 짠 순수 러스트 해석기, symphonia 의 AAC 가 받지 않는 것을 크롬처럼 푼다. AAC-LC 2 채널까지는 symphonia)
# 정수로 반올림하기 전의 실수 출력(set_float_pcm_capture)이 아직 crates.io 판(0.1.7)에 없어 저장소의 커밋으로 묶는다. 다음 판이 나오면 crates.io 로 바꾼다
oxideav-aac = { git = "https://github.com/OxideAV/oxideav-aac", rev = "eac68f31d7a7310bb8ac298c6591a0177b846340" }
# SVG 그림. (데스크탑, usvg 로 읽고 tiny-skia 로 그린다. 원본은 브라우저가 SVG 를 그림으로 푼다. 웹은 브라우저가 푼다)
resvg = "0.50"
# 2D 그리기 대상 Canvas2D 의 칠하기. (데스크탑, 크롬이 쓰는 Skia 의 CPU 래스터라이저를 옮긴 것. resvg 가 쓰는 같은 판이라 더 받는 크레이트가 없다. 원본과 웹은 브라우저 캔버스)
tiny-skia = "0.12"
# AVIF 그림. (데스크탑, HEIF 상자는 엔진이 읽고 dav1d 를 러스트로 옮긴 rav1d 로 AV1 을 푼다. 원본은 브라우저가 AVIF 를 푼다. 웹은 브라우저가 푼다)
# rav1d 의 asm 은 끈다. (켜면 x86 에서 nasm, arm 에서 C 어셈블러가 있어야 빌드된다. 그림 한 장 푸는 데는 순수 러스트로 넉넉하다)
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# 한중일 사전(cjdict)의 낱말 값을 읽는다. (icu_segmenter 가 쓰는 같은 판, 크롬의 ICU4C 처럼 낱말 값의 합이 가장 작은 나누기를 고른다)
icu_provider = "2"
icu_collections = "2"
# 한중일 사전 찾기 전에 NFKC 로 바꾼다. (반각 가타카나 → 전각, ICU4C CjkBreakEngine 과 같다)
unicode-normalization = "0.1"
# 시스템 클립보드. (입력 필드의 복사, 잘라내기, 붙여넣기. winit 에 클립보드가 없다. 그림 기능은 끈다)
arboard = { version = "3", default-features = false }
# 시스템 언어 목록. (윈도우 GetUserPreferredUILanguages, 맥 CFLocaleCopyPreferredLanguages, 리눅스 LANGUAGE / LC_ALL / LC_MESSAGES / LANG. 원본 navigator.languages 자리)
sys-locale = "0.3"
# rustls 의 암호 공급자. (tungstenite 가 rustls 를 기본 기능 없이 쓰므로 ring 을 켜고, WebSocketClient 가 붙을 때 정한다. tls 기능일 때만)
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

# 윈도우: 잠자기에서 깸(WM_POWERBROADCAST)을 받으려 창을 서브클래싱하고, 주된 손이 손가락인지 크로미엄처럼 읽는다. 크롬처럼 system-ui 의 메뉴 글꼴(NONCLIENTMETRICS)과 ClearType 켜짐, 대체 글꼴을 고를 사용자 기본 언어를 읽는다.
# 편집 칸 문맥 메뉴의 그림 이모티콘은 크롬처럼 SendInput 으로 윈도우 키 + '.' 을 보낸다.
# 터치 키보드 스레드의 메시지 큐(GetCurrentThreadId, PostThreadMessageW)와 개발자 도구의 힙 사용량(HeapSummary)도 읽는다. (winit 과 같은 판, 쓰는 기능만 켠다)
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# 윈도우: 시스템 글꼴. (DirectWrite 로 글꼴 이름의 파일을 찾고, 글꼴에 없는 글자의 대체 글꼴을 IDWriteFontFallback 으로 고른다. 원본 크롬 윈도우도 DirectWrite 로 고른다. 마이크로소프트의 windows 크레이트로 cpal, gilrs 가 쓰는 같은 판이라 더 받는 크레이트가 없다. windows-core 는 #[implement] 가 지은 코드가 부른다)
# 터치 키보드는 크롬 윈도우처럼 창에 묶은 WinRT InputPane(IInputPaneInterop)으로 띄우고 내리며 가린 영역을 받는다.
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_System_WinRT"] }
windows-core = "0.62"

# 맥: 게임패드 진동. (gilrs 의 macOS force feedback 이 비어 있어, GameController 의 GCController.haptics 로 CoreHaptics 엔진을 지어 떤다. 쓰는 기능만 켠다)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSSet", "NSString"] }
objc2-game-controller = { version = "0.3", default-features = false, features = ["std", "GCController", "GCDevice", "GCDeviceHaptics"] }
objc2-core-haptics = { version = "0.3", default-features = false, features = ["std", "block2", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer"] }
block2 = "0.6"
# 맥: 시스템 글꼴. (CoreText 로 글꼴 이름과 시스템 UI 글꼴의 파일을 찾고, 글꼴에 없는 글자의 대체 글꼴을 CTFontCreateForString 으로 고른다. 원본 크롬 맥도 CoreText 로 고른다)
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFURL", "CFDictionary", "CFNumber", "CFArray", "CFData", "CFCGTypes", "CFCharacterSet"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTFontManager"] }
# 맥: 색 이모지와 열린 해석기가 없는 글꼴(PingFang 의 hvgl)의 글리프를 CoreText 로 그린다. (원본 크롬 맥도 CoreGraphics 로 그린다)
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGFont", "CGImage"] }

# 리눅스와 그 밖의 유닉스: 시스템 글꼴. (fontconfig 로 글꼴 이름과 대체 글꼴을 고른다. 원본 크롬 리눅스도 fontconfig 로 고른다. 라이브러리는 빌드할 때 잇지 않고 실행할 때 연다)
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
yeslogic-fontconfig-sys = { version = "6", features = ["dlopen"] }
# 주된 손이 손가락인지 크로미엄처럼 화면 서버의 입력 장치로 읽는다. (X11 XInput 은 x11-dl 로 libX11, libXi 를 실행할 때 열고, 웨이랜드 wl_seat 은 wayland-client. 둘 다 glutin, winit 이 쓰는 같은 판)
# 웨이랜드 창의 가려짐과 수직 동기는 winit 의 wl_display 에 손님으로 붙어 wl_surface.frame 콜백으로 본다. (libwayland 를 쓰는 system 백엔드, winit 도 켜는 기능)
x11-dl = "2.21"
wayland-client = { version = "0.31", features = ["system"] }

# 웹(wasm): 캔버스와 WebGL2, requestAnimationFrame, WebAudio, fetch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext", "CssStyleDeclaration", "HtmlElement", "KeyboardEvent", "console", "AudioContext", "BaseAudioContext", "OfflineAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "AudioParam", "AudioListener", "PannerNode", "PanningModelType", "DistanceModelType", "GainNode", "OscillatorNode", "OscillatorType", "Response", "Performance", "Navigator", "VisibilityState", "Storage", "HtmlInputElement", "HtmlTextAreaElement", "HtmlHeadElement", "Event", "CompositionEvent", "MouseEvent", "WheelEvent", "MediaQueryList", "TouchEvent", "TouchList", "Touch", "DomRect", "Node", "AddEventListenerOptions", "CanvasRenderingContext2d", "CanvasWindingRule", "CanvasGradient", "CanvasPattern", "Path2d", "TextMetrics", "ImageData", "Blob", "BlobPropertyBag", "Url", "HtmlImageElement"] }

# 출시 빌드. (한 덩어리로 묶어 최적화하고 디버그 기호를 뺀다. 이 저장소를 맨 위로 빌드할 때만 쓰인다)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# 웹(wasm) 출시 빌드. (release 와 같되 기호를 남겨 wasm-bindgen 이 wasm 기능 정보를 읽게 한다. 줄이는 건 wasm-bindgen 이 한다)
[profile.wasm-release]
inherits = "release"
strip = false

# 고친 ttf-parser 하나로 모은다. (rustybuzz 말고도 fontdue, owned_ttf_parser 가 같은 0.25.1 을 쓴다. 짝 커닝 장치 표 기준을 바로 읽는 판 하나만 빌드되게. 이 저장소를 뿌리로 빌드할 때만 걸리고, 엔진을 의존으로 받는 게임은 rustybuzz 쪽만 고친 판을 쓴다)
[patch.crates-io]
ttf-parser = { path = "third_party/ttf-parser" }
