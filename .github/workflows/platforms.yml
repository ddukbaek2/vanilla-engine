# 플랫폼 확인. (윈도우, 리눅스 X11 과 웨이랜드에서 시험을 돌리고 예제를 찍어 같은 기계의 크롬과 견준다)
# - 손으로만 돌린다(workflow_dispatch). 고친 것은 먼저 로컬(맥 본디, 로제타 x86_64, 도커 리눅스)에서 확인해 문제가 없을 때 윈도우, 리눅스 마지막 확인으로 한 번 돌린다.
#   CI 로 문제를 찾거나 고치며 되풀이해 돌리지 않는다. 맥은 로컬 기계로 확인하므로 맥 러너는 쓰지 않는다. (2026-11-27 뚝백이님)
# - 시험: cargo test --workspace (doctest 포함), 데스크탑 플랫폼 시험(tests/desktopplatform.rs 의 #[ignore] 시험: 시스템 글꼴, 대체 글꼴, 색 이모지, 클립보드, 크롬 measureText 견주기)
# - 그림: GPU 가 없는 기계라 메사 llvmpipe 소프트웨어 GL 로 그린다. (리눅스는 Xvfb 의 GLX 와 weston headless 의 EGL, 윈도우는 메사 opengl32.dll 을 예제 옆에 둔 WGL)
#   예제는 찍기 모드(VANILLA_CAPTURE_PATH)로 돌려 그림을 아티팩트로 올린다. (.github/scripts/captureexamples.cjs)
# - 크롬 견주기: 원본 vanilla.js 를 옆에 받아 같은 장면의 예제 페이지를 헤드리스 크롬으로 찍어 화소 차이를 낸다. (.github/scripts/chromecompare.cjs)
# - 글리프 견주기: 글자 장면(examples/glyphparity.rs, tests/assets/glyphparity/index.html)을 같은 기계의 크롬과 견줘 글자 구역의 화소 차이를 낸다. (.github/scripts/glyphcompare.cjs)
#   소리 해석, 믹서, 비프, PannerNode 의 크롬 기대값(tests/assets/*/chrome*.cjs)을 같은 기계의 크롬으로 다시 찍어 견준다. (x86 크롬)
#   크롬은 러너에 깔린 것을 쓰지 않고 browser-actions/setup-chrome 으로 Chrome for Testing 판을 고정해 세 기계가 같은 판을 쓴다. (CHROME_PATH)
#   러너에 깔린 크롬은 기계마다 판이 달랐다. (2026-11-26 인텔 맥 151, 리눅스 157, 윈도우 158) 151 은 decodeAudioData 가 158 과 달라
#   (AAC 끝 remainder 를 안 자르고 HE-AAC, webm Opus 길이와 5.1 Opus 채널 차례가 다르다) 기대값이 맞지 않았다. 판은 기대값을 찍은 크롬과 같게 올린다.
# - 소리: 소리 장치가 없는 기계라 가상 장치를 깐다. (LABSN/sound-ci-helpers: 리눅스 PulseAudio, 윈도우 VB-CABLE, 맥 Background Music)
# - 웹: wasm32 로 예제를 빌드한다.
name: 플랫폼 확인

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: 데스크탑 ${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux
            os: ubuntu-latest
          - tag: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: vanilla-engine
    steps:
      - name: 엔진 받기
        uses: actions/checkout@v7
        with:
          path: vanilla-engine

      - name: 원본 갈래 고르기 (엔진과 같은 이름의 갈래가 원본에 있으면 그것, 없으면 dev)
        id: original
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/ddukbaek2/vanilla.js.git "$BRANCH_NAME" > /dev/null; then
            ref="$BRANCH_NAME"
          else
            ref=dev
          fi
          echo "원본 갈래: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: 원본 vanilla.js 받기 (예제 애셋과 견줄 페이지)
        uses: actions/checkout@v7
        with:
          repository: ddukbaek2/vanilla.js
          ref: ${{ steps.original.outputs.ref }}
          path: vanilla.js

      - name: 러스트
        uses: dtolnay/rust-toolchain@stable

      - name: 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vanilla-engine
          cache-on-failure: true

      - name: 리눅스 꾸러미 (빌드 헤더, X11 과 웨이랜드, 메사, 글꼴)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 mesa-utils \
            xvfb weston gdb jq fontconfig fonts-dejavu-core fonts-liberation fonts-noto-cjk fonts-noto-color-emoji fonts-thai-tlwg
          fc-match sans-serif
          fc-match serif
          fc-match monospace

      - name: 가상 소리 장치
        uses: LABSN/sound-ci-helpers@v1

      - name: Xvfb (리눅스 X11 화면)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "WINIT_X11_SCALE_FACTOR=1" >> "$GITHUB_ENV"
          sleep 3
          DISPLAY=:99 glxinfo -B

      - name: 결과 폴더와 노드 꾸러미 (puppeteer-core, pngjs)
        run: |
          # 윈도우는 노드와 cargo 도 읽는 D:/a/... 꼴로 둔다.
          workspace_path=$(cygpath -m "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")
          temporary_path=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          export OUT="$workspace_path/out"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/shots" "$OUT/logs" "$OUT/chrome"
          npm install --no-save --no-package-lock --prefix "$temporary_path/npm" puppeteer-core@25.17.0 pngjs@7.0.0
          echo "NODE_PATH=$temporary_path/npm/node_modules" >> "$GITHUB_ENV"

      - name: 크롬 (Chrome for Testing 158.0.8127.88, 세 기계가 같은 판)
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 158.0.8127.88
          install-dependencies: true
      - name: 크롬 경로 (견주기 스크립트가 CHROME_PATH 로 읽는다)
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # 우분투 23.10 뒤로는 AppArmor 가 권한 없는 사용자 이름공간을 막아, AppArmor 프로필이 없는 Chrome for Testing 이 샌드박스를 못 띄운다. (deb 로 깐 google-chrome 은 프로필이 있다)
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "크롬 ${{ steps.chrome.outputs.chrome-version }}: ${{ steps.chrome.outputs.chrome-path }}"

      - name: 소리 크롬 견주기 (같은 기계의 크롬으로 기대값을 다시 찍는다)
        if: success() || failure()
        run: |
          node tests/assets/audio/chromedecode.cjs
          node tests/assets/mixer/chromemixer.cjs
          node tests/assets/mixer/chromebeep.cjs
          node tests/assets/spatialaudio/chromespatial.cjs
          mkdir -p "$OUT/chrome/${{ matrix.tag }}_audio"
          cp tests/assets/audio/chrome_decode.json tests/assets/mixer/chrome_mixer.json tests/assets/mixer/chrome_beep.json tests/assets/spatialaudio/chrome_spatial.json tests/assets/spatialaudio/chrome_spatial_hrtf.json "$OUT/chrome/${{ matrix.tag }}_audio/"
          status=0
          cargo test --lib matches_chrome -- --nocapture 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_chromeaudio.log" || status=$?
          git checkout -- tests/assets
          exit $status

      - name: 윈도우 소프트웨어 GL (메사 llvmpipe 의 opengl32.dll 을 시험과 예제 실행 파일 옆에 둔다, 시험보다 먼저)
        if: runner.os == 'Windows'
        run: |
          # 드라이버가 없는 윈도우의 opengl32.dll 은 GDI 의 GL 1.1 이라, 메사 opengl32.dll 을 실행 파일 옆에 두어 먼저 읽게 한다. (앱별 배치)
          # mesa-dist-win 26.x 의 MSVC 묶음은 d3d12 비디오 가속 빌드 회귀로 OpenGL 소프트웨어 렌더링이 빠져 있어(그 릴리스 설명), llvmpipe 만 든 mmozeiko/build-mesa 빌드를 쓴다.
          temporary_path=$(cygpath -m "$RUNNER_TEMP")
          curl -sSfL -o "$temporary_path/mesa-llvmpipe.7z" https://github.com/mmozeiko/build-mesa/releases/download/26.2.6/mesa-llvmpipe-x64-26.2.6.7z
          7z x -y -o"$temporary_path/mesa-llvmpipe" "$temporary_path/mesa-llvmpipe.7z" opengl32.dll > /dev/null
          # cargo test 의 시험 실행 파일은 target/debug/deps 에서 돈다. 시험 단계보다 먼저 두 자리에 둔다. (2026-11-28 시험 단계가 GL 1.1 로 죽던 것)
          mkdir -p target/debug/deps target/debug/examples
          cp "$temporary_path/mesa-llvmpipe/opengl32.dll" target/debug/deps/
          cp "$temporary_path/mesa-llvmpipe/opengl32.dll" target/debug/examples/
          ls -la target/debug/deps/opengl32.dll target/debug/examples/opengl32.dll

      - name: 시험 (cargo test --workspace)
        id: tests
        if: success() || failure()
        timeout-minutes: 90
        run: cargo test --workspace --no-fail-fast 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_test.log"

      - name: 초안 두 엔진 견주기 (원본 물리 장면이 러스트 comparison.txt 와 비트까지 같은지, 원본 초안 시험과 3D 자산 캐시 시험)
        if: always()
        working-directory: vanilla.js
        shell: bash
        run: |
          node tools/physics2dcompare.mjs --check ../vanilla-engine/src/experimental/physics2d/comparison.txt
          node tests/run.mjs
          diff -r ../vanilla-engine/src/ui/testdata/uidocument tests/ui/testdata/uidocument

      - name: 리눅스 라이브러리 시험이 죽으면 gdb 로 다시 돌려 죽은 스레드 보기
        if: runner.os == 'Linux' && steps.tests.outcome == 'failure'
        run: |
          test_binary=$(cargo test --lib --no-run --message-format=json 2>/dev/null | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and (.target.kind | index("lib"))) | .executable' | head -n 1)
          echo "시험 실행 파일: $test_binary"
          for attempt in 1 2 3; do
            gdb -q -batch -ex "set pagination off" -ex "handle SIGPIPE nostop noprint pass" -ex run -ex "info threads" -ex "bt 40" -ex "thread apply all bt 6" --args "$test_binary" > "$OUT/logs/linux_gdb_$attempt.log" 2>&1 || true
            if grep -q "SIGSEGV\|SIGBUS\|SIGABRT" "$OUT/logs/linux_gdb_$attempt.log"; then
              grep -n -A 80 "received signal" "$OUT/logs/linux_gdb_$attempt.log" | head -n 160
              break
            fi
            echo "시도 $attempt: 죽지 않음"
            tail -n 3 "$OUT/logs/linux_gdb_$attempt.log"
          done

      - name: 예제 빌드
        if: success() || failure()
        run: cargo build --examples

      - name: 데스크탑 플랫폼 시험 (시스템 글꼴, 대체 글꼴, 클립보드, 크롬 measureText)
        if: success() || failure()
        run: |
          node tests/assets/systemfont/chromemeasure.cjs "$OUT/chrome/${{ matrix.tag }}_chrome_measure.json"
          VANILLA_CHROME_MEASURE_PATH="$OUT/chrome/${{ matrix.tag }}_chrome_measure.json" cargo test --test desktopplatform -- --ignored --nocapture --test-threads=1 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_desktopplatform.log"

      - name: 예제 찍기
        if: success() || failure()
        run: |
          tag=${{ matrix.tag }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag=linux-x11
          fi
          node .github/scripts/captureexamples.cjs "$OUT/shots" "$tag"

      - name: 웨이랜드 예제 찍기 (weston headless)
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          if [ -z "$XDG_RUNTIME_DIR" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
          fi
          weston --version
          weston --backend=headless --renderer=pixman --socket=wayland-ci --width=1920 --height=1080 --idle-time=0 > "$OUT/logs/weston.log" 2>&1 &
          weston_process=$!
          for index in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
              break
            fi
            sleep 1
          done
          tail -n 20 "$OUT/logs/weston.log"
          status=0
          env -u DISPLAY WAYLAND_DISPLAY=wayland-ci LIBGL_ALWAYS_SOFTWARE=1 node .github/scripts/captureexamples.cjs "$OUT/shots" linux-wayland quickstart,textshaping,inputgallery,uigallery,toonstyle,physics2d || status=$?
          kill "$weston_process" || true
          exit $status

      - name: 소리와 게임패드 (audiotone, gamepadlist)
        if: success() || failure()
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          "./target/debug/examples/audiotone$suffix" 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_audiotone.log"
          "./target/debug/examples/gamepadlist$suffix" 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_gamepadlist.log"
          grep -qF "소리 장치 true" "$OUT/logs/${{ matrix.tag }}_audiotone.log"
          grep -qF "재생 중 true (0.1초 뒤)" "$OUT/logs/${{ matrix.tag }}_audiotone.log"

      - name: 원본 예제 크롬 견주기 (화소 차이)
        if: success() || failure()
        run: |
          tag=${{ matrix.tag }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag=linux-x11
          fi
          node .github/scripts/chromecompare.cjs ../vanilla.js "$OUT/shots" "$tag"

      - name: 글리프 래스터 크롬 견주기 (글자 구역 화소 차이)
        if: success() || failure()
        run: |
          tag=${{ matrix.tag }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag=linux-x11
          fi
          node .github/scripts/glyphcompare.cjs "$OUT/shots/${tag}_glyphparity_20.png" "$OUT/shots" "$tag" 2>&1 | tee "$OUT/logs/${tag}_glyphcompare.log"

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platforms-${{ matrix.tag }}
          path: out/
          if-no-files-found: warn

  web:
    name: 웹 (wasm32 빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vanilla-engine
    steps:
      - name: 엔진 받기
        uses: actions/checkout@v7
        with:
          path: vanilla-engine

      - name: 러스트 (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vanilla-engine
          cache-on-failure: true

      - name: 예제 빌드 (wasm32)
        run: cargo build --target wasm32-unknown-unknown --examples
