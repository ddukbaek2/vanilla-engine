# 플랫폼 확인. (윈도우, 리눅스 X11 과 웨이랜드, 인텔 맥에서 시험을 돌리고 예제를 찍어 같은 기계의 크롬과 견준다)
# - 시험: cargo test --workspace (doctest 포함), 데스크탑 플랫폼 시험(tests/desktopplatform.rs 의 #[ignore] 시험: 시스템 글꼴, 대체 글꼴, 색 이모지, 클립보드, 크롬 measureText 견주기)
# - 그림: GPU 가 없는 기계라 메사 llvmpipe 소프트웨어 GL 로 그린다. (리눅스는 Xvfb 의 GLX 와 weston headless 의 EGL, 윈도우는 mesa-dist-win 의 WGL)
#   예제는 찍기 모드(VANILLA_CAPTURE_PATH)로 돌려 그림을 아티팩트로 올린다. (.github/scripts/captureexamples.cjs)
# - 크롬 견주기: 원본 vanilla.js 를 옆에 받아 같은 장면의 예제 페이지를 헤드리스 크롬으로 찍어 화소 차이를 낸다. (.github/scripts/chromecompare.cjs)
#   소리 해석, 믹서, 비프, PannerNode 의 크롬 기대값(tests/assets/*/chrome*.cjs)을 같은 기계의 크롬으로 다시 찍어 견준다. (x86 크롬)
# - 소리: 소리 장치가 없는 기계라 가상 장치를 깐다. (LABSN/sound-ci-helpers: 리눅스 PulseAudio, 윈도우 VB-CABLE, 맥 Background Music)
# - 웹: wasm32 로 예제를 빌드한다.
name: 플랫폼 확인

on:
  push:
    branches: [dev, release, "ci-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: 데스크탑 ${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: linux
            os: ubuntu-latest
          - tag: windows
            os: windows-latest
          - tag: macos-intel
            os: macos-26-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: vanilla-engine
    steps:
      - name: 엔진 받기
        uses: actions/checkout@v7
        with:
          path: vanilla-engine

      - name: 원본 vanilla.js 받기 (예제 애셋과 견줄 페이지)
        uses: actions/checkout@v7
        with:
          repository: ddukbaek2/vanilla.js
          ref: dev
          path: vanilla.js

      - name: 러스트
        uses: dtolnay/rust-toolchain@stable

      - name: 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vanilla-engine
          cache-on-failure: true

      - name: 리눅스 꾸러미 (빌드 헤더, X11 과 웨이랜드, 메사, 글꼴)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6 libgl1-mesa-dri libegl1 libegl-mesa0 libglx-mesa0 mesa-utils \
            xvfb weston fontconfig fonts-dejavu-core fonts-liberation fonts-noto-cjk fonts-noto-color-emoji
          fc-match sans-serif
          fc-match serif
          fc-match monospace

      - name: 윈도우 소프트웨어 GL (mesa-dist-win 의 llvmpipe)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
        with:
          version: '26.2.6'

      - name: 가상 소리 장치
        uses: LABSN/sound-ci-helpers@v1

      - name: Xvfb (리눅스 X11 화면)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "WINIT_X11_SCALE_FACTOR=1" >> "$GITHUB_ENV"
          sleep 3
          DISPLAY=:99 glxinfo -B

      - name: 결과 폴더와 노드 꾸러미 (puppeteer-core, pngjs)
        run: |
          # 윈도우는 노드와 cargo 도 읽는 D:/a/... 꼴로 둔다.
          workspace_path=$(cygpath -m "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")
          temporary_path=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          export OUT="$workspace_path/out"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/shots" "$OUT/logs" "$OUT/chrome"
          npm install --no-save --no-package-lock --prefix "$temporary_path/npm" puppeteer-core@25.17.0 pngjs@7.0.0
          echo "NODE_PATH=$temporary_path/npm/node_modules" >> "$GITHUB_ENV"

      - name: 시험 (cargo test --workspace)
        timeout-minutes: 90
        run: cargo test --workspace --no-fail-fast 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_test.log"

      - name: 예제 빌드
        if: success() || failure()
        run: cargo build --examples

      - name: 데스크탑 플랫폼 시험 (시스템 글꼴, 대체 글꼴, 클립보드, 크롬 measureText)
        if: success() || failure()
        run: |
          node tests/assets/systemfont/chromemeasure.cjs "$OUT/chrome/${{ matrix.tag }}_chrome_measure.json"
          VANILLA_CHROME_MEASURE_PATH="$OUT/chrome/${{ matrix.tag }}_chrome_measure.json" cargo test --test desktopplatform -- --ignored --nocapture --test-threads=1 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_desktopplatform.log"

      - name: 예제 찍기
        if: success() || failure()
        run: |
          tag=${{ matrix.tag }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag=linux-x11
          fi
          node .github/scripts/captureexamples.cjs "$OUT/shots" "$tag"

      - name: 웨이랜드 예제 찍기 (weston headless)
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          if [ -z "$XDG_RUNTIME_DIR" ] || [ ! -d "$XDG_RUNTIME_DIR" ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
          fi
          weston --version
          weston --backend=headless --renderer=pixman --socket=wayland-ci --width=1920 --height=1080 --idle-time=0 > "$OUT/logs/weston.log" 2>&1 &
          weston_process=$!
          for index in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-ci" ]; then
              break
            fi
            sleep 1
          done
          tail -n 20 "$OUT/logs/weston.log"
          status=0
          env -u DISPLAY WAYLAND_DISPLAY=wayland-ci LIBGL_ALWAYS_SOFTWARE=1 node .github/scripts/captureexamples.cjs "$OUT/shots" linux-wayland quickstart,textshaping,inputgallery,uigallery,toonstyle,physics2d || status=$?
          kill "$weston_process" || true
          exit $status

      - name: 소리와 게임패드 (audiotone, gamepadlist)
        if: success() || failure()
        run: |
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi
          "./target/debug/examples/audiotone$suffix" 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_audiotone.log"
          "./target/debug/examples/gamepadlist$suffix" 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_gamepadlist.log"
          grep -qF "소리 장치 true" "$OUT/logs/${{ matrix.tag }}_audiotone.log"
          grep -qF "재생 중 true (0.1초 뒤)" "$OUT/logs/${{ matrix.tag }}_audiotone.log"

      - name: 소리 크롬 견주기 (같은 기계의 크롬으로 기대값을 다시 찍는다)
        if: success() || failure()
        run: |
          node tests/assets/audio/chromedecode.cjs
          node tests/assets/mixer/chromemixer.cjs
          node tests/assets/mixer/chromebeep.cjs
          node tests/assets/spatialaudio/chromespatial.cjs
          mkdir -p "$OUT/chrome/${{ matrix.tag }}_audio"
          cp tests/assets/audio/chrome_decode.json tests/assets/mixer/chrome_mixer.json tests/assets/mixer/chrome_beep.json tests/assets/spatialaudio/chrome_spatial.json tests/assets/spatialaudio/chrome_spatial_hrtf.json "$OUT/chrome/${{ matrix.tag }}_audio/"
          status=0
          cargo test --lib matches_chrome -- --nocapture 2>&1 | tee "$OUT/logs/${{ matrix.tag }}_chromeaudio.log" || status=$?
          git checkout -- tests/assets
          exit $status

      - name: 원본 예제 크롬 견주기 (화소 차이)
        if: success() || failure()
        run: |
          tag=${{ matrix.tag }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            tag=linux-x11
          fi
          node .github/scripts/chromecompare.cjs ../vanilla.js "$OUT/shots" "$tag"

      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platforms-${{ matrix.tag }}
          path: out/
          if-no-files-found: warn

  web:
    name: 웹 (wasm32 빌드)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vanilla-engine
    steps:
      - name: 엔진 받기
        uses: actions/checkout@v7
        with:
          path: vanilla-engine

      - name: 러스트 (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 빌드 캐시
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vanilla-engine
          cache-on-failure: true

      - name: 예제 빌드 (wasm32)
        run: cargo build --target wasm32-unknown-unknown --examples
