[package]
name = "vanilla-engine-apidoc"
version = "0.3.2"
description = "바닐라엔진(Vanilla Engine)의 API 문서 자료 뽑기. 엔진 소스의 문서 주석에서 docs/api/<판>.json 을 쓴다"
edition = "2021"
# 저작권자. (LICENSE 의 Copyright 줄과 같다)
authors = ["vanillapunch"]
license = "MIT"
publish = false
# cargo package 에 싣는 파일. (소스와 라이선스, LICENSE 는 뿌리 LICENSE 와 같은 글)
include = ["/src/**/*", "/LICENSE"]

# 가이드 문서(docs/guide/<판>/ko)의 rust 코드 칸을 doctest 로 검사하는 자리. (cargo test --doc -p vanilla-engine-apidoc)
[lib]
path = "src/lib.rs"

# 뽑는 도구. (cargo run -p vanilla-engine-apidoc -- <판>)
[[bin]]
name = "vanilla-engine-apidoc"
path = "src/main.rs"

[dependencies]
# 러스트 소스 읽기. (엔진과 매크로 크레이트의 아이템, 문서 속성, 시그니처. visit 은 모든 함수의 머리 주석 검사)
syn = { version = "2", features = ["full", "visit"] }
# 토큰의 줄과 칸. (시그니처와 꼴을 소스 글 그대로 옮기고, 문서 주석이 없을 때 머리 주석을 찾는다. syn 이 쓰는 같은 크레이트에 span-locations 만 켠다)
proc-macro2 = { version = "1", features = ["span-locations"] }
# 자료 쓰기. (엔진과 같은 판, 키 차례를 지킨다)
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# 가이드 코드 칸이 엔진을 vanilla 로 쓴다.
vanilla-engine = { path = "../.." }
# 가이드 3D 장의 코드 칸이 GL 상태를 glow 로 직접 건다. (엔진이 쓰는 같은 판)
glow = "0.18"
